[package]
name = "gpui-whiteboard"
version = "0.5.1"
edition = "2024"
publish = false

[lib]
# Reuse Frame's exact board source; only the GPUI dependency identity changes.
# This avoids pulling theoremweb's entire design/application graph through fonts.
path = "../../../vendor/gpui-whiteboard/src/lib.rs"

[dependencies]
gpui = { git = "https://github.com/Travis-Gilbert/zed", rev = "6d4d90754f7dde3e62afb6fe74a632c0b4660396", version = "=0.2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
ttf-parser = "0.25"
theorem-space = { path = "../../../deps/theorem-search/rustyredcore_THG/crates/theorem-space", optional = true, default-features = false }

[features]
default = ["space"]
space = ["dep:theorem-space"]

[lints.rust]
unsafe_code = "forbid"
