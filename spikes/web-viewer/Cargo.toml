[package]
name = "frame-web-viewer-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_web = { package = "gpui-pre-web", version = "=0.3.9", default-features = false }
gpui-whiteboard = { path = "../../vendor/gpui-whiteboard" }
serde_json = "1"
# Match the installed CLI; gpui-pre-web accepts this patch version.
wasm-bindgen = "=0.2.127"

[patch.crates-io]
gpui-pre = { path = "../../vendor/gpui-pre" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
