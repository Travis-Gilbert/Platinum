[package]
name = "gpui-whiteboard"
version = "0.5.1"
edition = "2024"
description = "An infinite whiteboard canvas for GPUI: shapes, arrows, freehand drawing, text, images, and templates, with a built-in toolbar."
license = "MIT"
publish = false
repository = "https://github.com/packetThrower/zorite"
homepage = "https://packetthrower.github.io/zorite/reference/crates/gpui-whiteboard/"
keywords = ["gpui", "whiteboard", "canvas", "drawing", "infinite-canvas"]
categories = ["gui", "graphics"]

[dependencies]
# THEOREM PATCH: use Frame's existing patched GPUI snapshot.
gpui = { package = "gpui-pre", version = "=0.3.9" }

# The board model (`Scene` + camera, and elements once drawing lands) is owned
# and (de)serialized by this crate, so the host can persist it as an opaque
# JSON string in its own store.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

log = "0.4"

# Glyph outlines for on-canvas text: text is rendered as vector paths (not gpui
# overlay glyphs) so it rotates + scales with the camera and shapes, and so the
# host can supply a custom/user-uploaded face. Pinned to gpui's version so the
# lockfile unifies to a single copy.
ttf-parser = "0.25"

# The Space adapter (`space` module): the board as a projection of a
# renderer-neutral Space, its gestures returned as SpaceCommands (Canvas 2.5
# 8.2). Default-features only, so the fork still builds standalone with
# `--no-default-features`. Wasm-safe: the `canonical` feature stays off.
theorem-space = { path = "../../deps/theorem-rustyweb-pw2/rustyredcore_THG/crates/theorem-space", optional = true, default-features = false }

[features]
default = ["space"]
space = ["dep:theorem-space"]

[dev-dependencies]
# `#[gpui::test]` / `TestAppContext` are test-support only. A feature on the
# existing `gpui` edge adds no package, so the lockfile is unchanged.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

# No unsafe code in this fork (FORK.md); an upstream rebase that brings some
# in fails to compile until it is reviewed.
[lints.rust]
unsafe_code = "forbid"
