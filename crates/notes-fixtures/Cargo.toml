[package]
name = "notes-fixtures"
version = "0.1.0"
edition = "2024"
description = "The notes app's test corpus (a fixture vault, JSON Canvas samples, a 10,000-note generator) and the harness that records Obsidian 1.14.5's answers for it."
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Seeded, platform-independent randomness: ChaCha's stream is fixed by its seed.
rand = { version = "0.9", default-features = false }
rand_chacha = "0.9"
regex = "1"
walkdir = "2"
sha2 = "0.10"
# .base files and note frontmatter are YAML; the harness reads view names from the former.
serde_yaml_ng = "0.10"
# The isolated Obsidian of `reference --app`: a temp root, a copy of the vault, a process group to stop.
tempfile = "3"
fs_extra = "1"
rustix = { version = "1", features = ["process"] }
signal-hook = "0.3"
# A hung CLI call must not hang the run.
wait-timeout = "0.2"

[dev-dependencies]
# Markdown link targets in the fixture lints are percent-encoded.
percent-encoding = "2"
