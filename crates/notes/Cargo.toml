[package]
name = "frame-notes"
version = "0.1.0"
edition = "2024"
description = "Headless core of Frame's notes app: parses notes, resolves links and decides what the index contains."
publish = false

[dependencies]
# Document authority and vault filesystem, from the Theorem checkout Frame pins
# (`deps/` is created by script/bootstrap). Nothing here uses them yet; step 2
# binds them. They are linked now so the build and the AI-off audit
# (docs/plans/evidence/notes-deps-2026-10-26.md) cover them.
theorem-ide-runtime = { path = "../../deps/theorem-rustyweb-pw2/rustyredcore_THG/crates/theorem-ide-runtime" }
theorem-ide-authority = { path = "../../deps/theorem-rustyweb-pw2/rustyredcore_THG/crates/theorem-ide-authority" }
rustyred-thg-vfs = { path = "../../deps/theorem-rustyweb-pw2/rustyredcore_THG/crates/rustyred-thg-vfs" }

anyhow = "1"
comrak = { version = "=0.58.0", default-features = false }
indexmap = { version = "2", features = ["serde"] }
pathdiff = "0.2"
percent-encoding = "2"
regex = "1"
ropey = "1.6.1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
typed-path = "0.12"
ulid = "1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
