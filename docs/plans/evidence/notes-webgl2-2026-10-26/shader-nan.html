<!doctype html>
<meta charset="utf-8">
<title>shader NaN matrix</title>
<body style="background:#1d2a3a;color:#e8e8e8;font:13px monospace">
<pre id="log">shader NaN matrix</pre>
<script>
// A NaN vertex attribute is how cosmos.gl says "use the default size or color". Each case draws
// one point whose color comes from a different way of detecting or using that NaN, and reads the
// pixel back. A correct implementation gives the expected value for every case.
const canvas = document.createElement('canvas');
canvas.width = 16;
canvas.height = 1;
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const out = { ready: true, cases: [] };

const CASES = [
  // name, expression of the red channel in terms of the attributes `n` (NaN) and `v` (1.0) and vec4 `n4`
  ['isnan(float NaN)', 'isnan(n) ? 1.0 : 0.0', 1],
  ['isnan(float 1.0)', 'isnan(v) ? 1.0 : 0.0', 0],
  // Comparisons of a NaN are folded away by the driver's fast math and cannot be repaired by the
  // translation; they are recorded as limits, not as failures.
  ['n != n', 'n != n ? 1.0 : 0.0', 1, true],
  ['floatBitsToUint', '(floatBitsToUint(n) & 0x7fffffffu) > 0x7f800000u ? 1.0 : 0.0', 1],
  ['mix(float, float, isnan(float))', 'mix(0.25, 0.75, isnan(n) ? 1.0 : 0.0)', 0.75],
  ['isnan(vec4 NaN).x', 'isnan(n4).x ? 1.0 : 0.0', 1],
  ['isnan(vec4 1.0).x', 'isnan(vec4(v)).x ? 1.0 : 0.0', 0],
  ['mix(vec4 NaN, default, isnan(vec4))', 'mix(n4, vec4(0.5), isnan(n4)).x', 0.5],
  ['mix(vec4 1.0, default, isnan(vec4))', 'mix(vec4(v), vec4(0.5), isnan(vec4(v))).x', 1],
  ['min(NaN, 0.5) is not NaN', 'isnan(min(n, 0.5)) ? 1.0 : 0.0', null],
  ['abs(1.0 - NaN)', 'abs(1.0 - n) == abs(1.0 - n) ? 0.0 : 1.0', 1, true],
];

function program(expression) {
  const vs = `#version 300 es
in vec2 slot;
in float n;
in float v;
in vec4 n4;
flat out vec4 color;
void main() {
  gl_Position = vec4(slot.x, 0.0, 0.0, 1.0);
  gl_PointSize = 1.0;
  color = vec4(${expression}, 0.0, 0.0, 1.0);
}`;
  const fs = `#version 300 es
precision mediump float;
flat in vec4 color;
out vec4 o;
void main() { o = color; }`;
  const compile = (type, text) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, text);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  };
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'slot');
  gl.bindAttribLocation(p, 1, 'n');
  gl.bindAttribLocation(p, 2, 'v');
  gl.bindAttribLocation(p, 3, 'n4');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function buffer(data, location, size) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(location);
  gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
}

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
buffer(new Float32Array([-0.9375, 0]), 0, 2); // the first pixel's center
buffer(new Float32Array([NaN]), 1, 1);
buffer(new Float32Array([1]), 2, 1);
buffer(new Float32Array([NaN, NaN, NaN, NaN]), 3, 4);

for (const [name, expression, expected, limit] of CASES) {
  const entry = { name, expected };
  if (limit) entry.driverLimit = true;
  try {
    gl.getError();
    gl.useProgram(program(expression));
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.POINTS, 0, 1);
    const px = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    entry.red = px[0] / 255;
    entry.alpha = px[3] / 255;
    entry.error = gl.getError();
    entry.ok = expected === null ? true : Math.abs(entry.red - expected) < 0.01 && entry.alpha === 1;
  } catch (e) {
    entry.threw = String(e).slice(0, 200);
    entry.ok = false;
  }
  out.cases.push(entry);
}
out.failures = out.cases.filter((c) => !c.ok && !c.driverLimit).map((c) => c.name);
out.driverLimits = out.cases.filter((c) => !c.ok && c.driverLimit).map((c) => c.name);
out.passed = out.failures.length === 0;
document.getElementById('log').textContent = JSON.stringify(out, null, 1);
setTimeout(() => console.log('FRAME_MEDIA_FRAME svg-initial'), 300);
setTimeout(() => console.log('FRAME_MEDIA_RESULT ' + JSON.stringify(out)), 1500);
</script>
