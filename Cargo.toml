[package]
name = "frame"
version = "0.1.0"
edition = "2024"
description = "A standalone browser: Servo renders the web, GPUI Kit draws the chrome, RustyWeb is the default search engine."
license = "MIT"
publish = false

# Its own workspace: libservo is in this graph. `deps/` holds checkouts that
# are path dependencies, not members.
[workspace]
members = [
    "crates/profile",
    "crates/notes",
    "crates/notes-fixtures",
    "crates/text-check",
    "crates/text-check-editor",
    "vendor/zorite-editor",
    "vendor/zorite-markdown",
    "vendor/gpui-bidi",
    "vendor/gpui-whiteboard",
]
exclude = ["deps"]

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["speech"] }
parakeet-rs = { version = "=0.4.3", default-features = false, features = ["cpu", "api-28"] }
# Only for the `snapshot` feature: GPUI's window-to-image rendering.
gpui-pre = { version = "=0.3.9", optional = true }
gpui-whiteboard = { path = "vendor/gpui-whiteboard" }
# Servo 0.7 fork, branch Travis-Gilbert/youtube-mse; script/bootstrap-media pins the commit.
servo = { path = "deps/servo-consolidated/components/servo", features = ["webcrypto", "webgl", "brotli-compression-stream", "media-gstreamer"] }
# Use the same public suffix list as Servo.
net_traits = { package = "servo-net-traits", path = "deps/servo-consolidated/components/shared/net" }
# RustyWeb search sessions over the local browser substrate, from Theorem
# branch codex/rustyweb-programmable-web-2. `deps/` is created by
# script/bootstrap.
theorem-browser-substrate = { path = "deps/theorem-search/apps/browser-substrate" }
# The search sessions' query and provider types, from the same branch.
rustyred-web = { path = "deps/theorem-search/rustyredcore_THG/crates/rustyred-web" }
# Theorem's renderer-neutral chat host and its HTTP transport, from the same
# checkout; the Agent place drives it (`src/theorem/driver.rs`). Without its
# `record-view` feature, which brings Polars, Wasmtime and Burn.
theoremweb-agent-runtime = { path = "deps/theorem-search/apps/theoremweb/crates/agent-runtime", default-features = false }
# The documents that host projects and the intents the workbench hands it.
theorem-surface-contracts = { path = "deps/theorem-search/rustyredcore_THG/crates/theorem-surface-contracts" }
# The runtime's reqwest client needs Tokio's reactor wherever its futures are
# polled, and GPUI polls them on the main thread.
async-compat = "0.2.5"
# reqwest-based search providers need a Tokio runtime; `search.rs` keeps one
# for every search, off GPUI's executor, and a semaphore bounds how many run.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
# EmbeddingGemma 2 runs in-process: ONNX Runtime does the inference (on the
# GPU through WebGPU, whose Dawn library `build.rs` lets the binary find), the
# model's own tokenizer.json feeds it, and hf-hub fetches a pinned revision.
ort = { version = "=2.0.0-rc.15", features = ["webgpu"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }

anyhow = "1"
tempfile = "3"
# Three-way reconciliation of typing that continued during a note save.
diffy = "0.4.2"
# Result dates, as words in the local time zone. Already in Servo's graph.
chrono = "0.4"
# Search snippets arrive as HTML fragments; these parse them to text and
# emphasis (`markup.rs`). The versions GPUI Kit's TextView already builds.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
# Downloads: the server's file name, made safe for the disk.
content_disposition = "0.4"
# CRM files: a CSV table, and a SQLite database through the rusqlite the
# profile crate already links.
csv = "1"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
dirs = "6"
# Provider keys for RustyWeb live in a gitignored `.env`, never in settings files.
dotenvy = "0.15"
dpi = "0.1"
euclid = "0.22"
futures = "0.3"
gleam = "0.15"
glow = "0.17"
humansize = "2"
# Favicons, as the frames GPUI's images are made of.
image = { version = "0.25", default-features = false }
resvg = { version = "0.48.1", default-features = false }
log = "0.4"
mime_guess = "2"
percent-encoding = "2"
# Downloads stream through the same reqwest build RustyWeb's providers use.
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls-webpki-roots-no-provider"] }
# GPUI's HTTP client, so its images load from a URL (a result's favicon).
gpui-pre-reqwest-client = "=0.3.9"
# GPUI Kit's icons are in the binary in debug builds too. Otherwise a debug
# build reads them from the cargo registry at run time, and macOS asks again
# after every rebuild for access to the volume the registry is on.
rust-embed = { version = "8", features = ["debug-embed"] }
# Servo's graph links more than one rustls provider; main installs ring.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = "0.38"
sanitize-filename = "0.6"
# Home's recent pages and searches, kept as JSON in the app's data folder.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
frame-profile = { path = "crates/profile" }
frame-notes = { path = "crates/notes" }
frame-text-check = { path = "crates/text-check" }
frame-text-check-editor = { path = "crates/text-check-editor" }
zorite-editor = { path = "vendor/zorite-editor" }
url = { version = "2", features = ["serde"] }
kmeans_colors = { version = "0.7.1", default-features = false, features = ["palette_color"] }
palette = { version = "0.7", default-features = false, features = ["std"] }

[features]
# Opt-in native performance harness; absent from ordinary builds.
performance-check = []
# Development only: with `FRAME_SNAPSHOT=<file.png>` in the environment, the
# window is kept as a picture in that file, redrawn every two seconds, to see
# the chrome where taking a screenshot needs a permission the session lacks.
snapshot = [
    "dep:gpui-pre",
    "gpui-pre/test-support",
    "dep:gpui-pre-macos",
    "gpui-pre-macos/test-support",
]

[dev-dependencies]
hound = "3.5"
# The graph probe's `frame-notes:` file handler sets a Content-Type header.
http = "1"
# Native media acceptance examples use the same CLI parser already in Servo.
clap = { version = "4", features = ["derive"] }
# Headless UI integration tests of the chrome (`src/browser/tests.rs`).
# GPUI's own test support: gpui-kit's `test-support` feature names
# `gpui-fast?/...`, which Cargo still resolves, and gpui-fast's wasm crate
# pins a `unicode-properties` that conflicts with Servo's.
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
# Shows the search workers' logs in `examples/serp_check.rs`.
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Opt into the native backend's existing render-to-image test support.
gpui-pre-macos = { version = "=0.3.9", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Only for the `snapshot` feature: the Mac window's side of rendering to an image.
gpui-pre-macos = { version = "=0.3.9", optional = true }
objc2 = "0.6"
# AppKit's shared color panel for `<input type=color>`; GPUI Kit already
# builds this crate with its default features.
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
# Read left/right Command state without a global keyboard hook.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
# The share sheet's page address, and the window's view to show it from.
objc2-foundation = "0.3.2"
raw-window-handle = "0.6"
# Wrapping Servo's IOSurface frames for `gpui::surface()`.
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2-io-surface"] }
objc2-io-surface = "0.3.2"
surfman = "0.14"

[profile.dev]
# Servo is unusably slow unoptimized; optimize dependencies, keep the app debuggable.
[profile.dev.package."*"]
opt-level = 2
debug = 0

[patch.crates-io]
# See vendor/zed-font-kit/THEOREM-PATCH.md: freetype-sys 0.23 to match Servo.
zed-font-kit = { path = "vendor/zed-font-kit" }
# See vendor/gpui-pre/THEOREM-PATCH.md: a surface's corner radii reach the renderer.
gpui-pre = { path = "vendor/gpui-pre" }
# See vendor/gpui-pre-apple/THEOREM-PATCH.md: BGRA surfaces in GPUI's renderer,
# and rounded surfaces.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# See vendor/gpui-component/THEOREM-PATCH.md: a selected folder tab's own fill.
gpui-component = { path = "vendor/gpui-component" }
