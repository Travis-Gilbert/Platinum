<!doctype html>
<meta charset="utf-8">
<title>program lifecycle</title>
<body style="background:#1d2a3a;color:#e8e8e8;font:14px monospace">
<pre id="log">program lifecycle</pre>
<script>
// Exercises every way a WebGL program and its shaders can be released, once on WebGL1 and
// once on WebGL2. A correct implementation raises no GL error, and the harness reads the
// stderr log for "Last GL operation failed".
const SOURCES = {
  webgl: {
    vs: 'attribute vec4 p; void main(){ gl_Position = p; }',
    fs: 'precision mediump float; void main(){ gl_FragColor = vec4(1.0); }',
  },
  webgl2: {
    vs: '#version 300 es\nin vec4 p; void main(){ gl_Position = p; }',
    fs: '#version 300 es\nprecision mediump float; out vec4 o; void main(){ o = vec4(1.0); }',
  },
};

function run(kind) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 16;
  const gl = canvas.getContext(kind);
  if (!gl) return { supported: false };
  const result = { supported: true, steps: {}, jsErrors: [] };
  const src = SOURCES[kind];

  const compile = (type, text) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, text);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      result.jsErrors.push('compile: ' + gl.getShaderInfoLog(shader));
    }
    return shader;
  };
  const build = () => {
    const vs = compile(gl.VERTEX_SHADER, src.vs);
    const fs = compile(gl.FRAGMENT_SHADER, src.fs);
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      result.jsErrors.push('link: ' + gl.getProgramInfoLog(program));
    }
    return { vs, fs, program };
  };
  const step = (name, body) => {
    gl.getError();
    try { body(); } catch (e) { result.jsErrors.push(name + ': ' + e); }
    // A draw call forces the command queue to run, so errors surface in this step.
    gl.finish();
    result.steps[name] = gl.getError();
  };

  // 1. Deleted while not current.
  step('delete-idle', () => {
    const { program } = build();
    gl.deleteProgram(program);
  });
  // 2. Deleted while current, released by switching to another program.
  step('delete-current-then-switch', () => {
    const a = build();
    const b = build();
    gl.useProgram(a.program);
    gl.deleteProgram(a.program);
    gl.useProgram(b.program);
    gl.useProgram(null);
    gl.deleteProgram(b.program);
  });
  // 3. Deleted while current, released by useProgram(null).
  step('delete-current-then-null', () => {
    const a = build();
    gl.useProgram(a.program);
    gl.deleteProgram(a.program);
    gl.useProgram(null);
  });
  // 4. Explicit detachShader on a live program, then delete.
  step('detach-then-delete', () => {
    const a = build();
    gl.detachShader(a.program, a.vs);
    gl.detachShader(a.program, a.fs);
    result.attachedAfterDetach = gl.getAttachedShaders(a.program).length;
    gl.deleteProgram(a.program);
    gl.deleteShader(a.vs);
    gl.deleteShader(a.fs);
  });
  // 5. Shaders deleted first, while still attached, then the program.
  step('shaders-then-program', () => {
    const a = build();
    gl.deleteShader(a.vs);
    gl.deleteShader(a.fs);
    gl.deleteProgram(a.program);
  });
  // 6. The program is dropped without deleteProgram and reclaimed by the garbage collector
  //    later; only the live-program path above can be checked from script.
  step('relink-after-detach', () => {
    const a = build();
    gl.detachShader(a.program, a.fs);
    const fs = compile(gl.FRAGMENT_SHADER, src.fs);
    gl.attachShader(a.program, fs);
    gl.linkProgram(a.program);
    result.relinked = gl.getProgramParameter(a.program, gl.LINK_STATUS);
    gl.useProgram(a.program);
    gl.useProgram(null);
  });
  return result;
}

const out = { webgl1: run('webgl'), webgl2: run('webgl2') };
const failing = (r) => !r.supported || r.jsErrors.length > 0 || Object.values(r.steps).some((e) => e !== 0);
out.ready = true;
out.passed = !failing(out.webgl1) && !failing(out.webgl2);
document.getElementById('log').textContent = JSON.stringify(out, null, 1);
setTimeout(() => console.log('FRAME_MEDIA_FRAME svg-initial'), 300);
setTimeout(() => console.log('FRAME_MEDIA_RESULT ' + JSON.stringify(out)), 1500);
</script>
