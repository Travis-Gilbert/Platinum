[package]
name = "frame-profile"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.38", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
configparser = "3.3"
base64 = "0.22"
libloading = "0.9"
lz4_flex = "0.13"
tempfile = "3"
scraper = "0.24"
snss = { package = "snss-core", version = "=0.1.1" }
url = "2"
sha2 = "0.10"
zeroize = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
