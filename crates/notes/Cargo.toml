[package]
name = "frame-notes"
version = "0.1.0"
edition = "2024"
description = "Headless core of Frame's notes app: parses notes, resolves links and decides what the index contains."
publish = false

[dependencies]
# Document authority and vault filesystem from Frame's pinned Theorem checkout.
theorem-ide-runtime = { path = "../../deps/theorem-search/rustyredcore_THG/crates/theorem-ide-runtime" }
theorem-ide-authority = { path = "../../deps/theorem-search/rustyredcore_THG/crates/theorem-ide-authority" }
rustyred-thg-vfs = { path = "../../deps/theorem-search/rustyredcore_THG/crates/rustyred-thg-vfs" }

rustyred-thg-core = { path = "../../deps/theorem-search/rustyredcore_THG/crates/rustyred-thg-core" }

anyhow = "1"
libc = "0.2"
comrak = { version = "=0.58.0", default-features = false }
granit-parser = "=1.3.0"
indexmap = { version = "2", features = ["serde"] }
pathdiff = "0.2"
percent-encoding = "2"
regex = "1"
ropey = "1.6.1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
typed-path = "0.12"
ulid = "1"
walkdir = "2"

[dev-dependencies]
pretty_assertions = "1"
